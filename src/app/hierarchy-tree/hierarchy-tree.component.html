<mat-tree [dataSource]="treeData" [childrenAccessor]="childrenAccessor" class="hierarchy-tree">

  <!-- ── Leaf node ── -->
  <mat-tree-node
    *matTreeNodeDef="let node"
    [class.node-selected]="selectedId === node.hierarchyId"
  >
    <button mat-icon-button disabled class="toggle-spacer"></button>
    <span
      class="node-label"
      [matTooltip]="node.assemblyName"
      matTooltipShowDelay="400"
      (click)="onNodeClick(node)"
    >{{ node.assemblyName }}</span>
  </mat-tree-node>

  <!-- ── Branch node ── -->
  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" #nestedNode="matNestedTreeNode">
    <div
      class="mat-tree-node branch-node"
      [class.node-selected]="selectedId === node.hierarchyId"
    >
      <button mat-icon-button matTreeNodeToggle class="toggle-btn">
        <mat-icon>{{ nestedNode.isExpanded ? 'expand_more' : 'chevron_right' }}</mat-icon>
      </button>
      <span
        class="node-label"
        [matTooltip]="node.assemblyName"
        matTooltipShowDelay="400"
        (click)="onNodeClick(node)"
      >{{ node.assemblyName }}</span>
    </div>

    <div [class.children-hidden]="!nestedNode.isExpanded" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>

</mat-tree>
